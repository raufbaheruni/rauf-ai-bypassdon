<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAUF BAHERUNI - AI Provenance Remover</title>
    <!-- EXIF Data डालने वाली लाइब्रेरी -->
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #111; padding: 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.8); text-align: center; width: 90%; max-width: 400px; border: 1px solid #333; }
        .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #444; margin-bottom: 10px; }
        h1 { font-size: 22px; margin: 0; color: #fff; letter-spacing: 1px; }
        p.subtitle { color: #555; margin-top: 5px; font-size: 12px; letter-spacing: 2px; }
        .upload-box { border: 2px dashed #444; border-radius: 10px; padding: 30px; cursor: pointer; transition: 0.3s; background: #1a1a1a; }
        .upload-box:hover { border-color: #00c6ff; background: #222; }
        .upload-box p { margin: 5px 0; color: #aaa; }
        .status-box { margin: 20px 0; padding: 15px; background: #1a1a1a; border-radius: 10px; display: none; }
        .spinner { border: 4px solid #333; border-top: 4px solid #00c6ff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .btn { background: #fff; color: #000; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; text-decoration: none; display: block; box-sizing: border-box; }
        #preview { max-width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid #333; }
        .info { margin-top: 20px; font-size: 11px; color: #444; line-height: 1.5; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="profile.jpg" alt="RAUF BAHERUNI" class="profile-img">
            <h1>RAUF BAHERUNI</h1>
            <p class="subtitle">AI PROVENANCE REMOVER</p>
        </div>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p style="font-size: 30px;">⬆️</p>
            <p><strong>Upload AI Image</strong></p>
            <p style="font-size: 12px; color: #555;">JPG / PNG Supported</p>
            <input type="file" id="fileInput" accept="image/jpeg, image/png">
        </div>

        <div class="status-box" id="statusBox">
            <div class="spinner"></div>
            <p id="statusText" style="color: #00c6ff; margin: 0;">Processing Image...</p>
        </div>

        <img id="preview" src="" alt="Preview">
        
        <a class="btn" id="downloadBtn" href="#" download="BAHERUNI.jpg" style="display:none;">⬇️ Download Real Photo</a>
        
        <div class="info">
            <p>Removes SynthID & Hidden Watermarks</p>
            <p>Injects: iPhone 16 Pro EXIF Metadata</p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const preview = document.getElementById('preview');
        const downloadBtn = document.getElementById('downloadBtn');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusBox.style.display = 'block';
            preview.style.display = 'none';
            downloadBtn.style.display = 'none';
            statusText.innerText = "Reading Image Data...";

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    processImage(img);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processImage(img) {
            statusText.innerText = "Breaking AI Grid (Resampling)...";
            
            // 1. SUB-PIXEL RESAMPLING (Grid Break)
            // फोटो को 2% छोटा करके वापस बड़ा करेंगे ताकि AI की परफेक्ट ग्रिड टूट जाए
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // मैक्स साइज 1200 रखें ताकि ब्राउज़र क्रैश न हो
            let w = img.width, h = img.height;
            if (w > 1200 || h > 1200) {
                const scale = 1200 / Math.max(w, h);
                w = Math.floor(w * scale);
                h = Math.floor(h * scale);
            }
            
            canvas.width = w; canvas.height = h;
            
            // पहले 98% में छोटा करें
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w * 0.98; tempCanvas.height = h * 0.98;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0, w * 0.98, h * 0.98);
            
            statusText.innerText = "Injecting Sensor Noise...";

            // वापस ओरिजिनल साइज में लाएं
            ctx.drawImage(tempCanvas, 0, 0, w, h);

            // 2. NOISE INJECTION (SynthID Destroyer)
            // फोटो में अदृश्य नॉइज़ डालें जो डिटेक्टर को फूले
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                // Noise +10/-10
                const noise = (Math.random() - 0.5) * 20;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));     // Red
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise)); // Green
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise)); // Blue
            }
            ctx.putImageData(imageData, 0, 0);

            statusText.innerText = "Injecting iPhone 16 Pro EXIF...";

            // 3. EXIF METADATA INJECTION
            const now = new Date();
            const exifDate = now.getFullYear() + ":" + ("0" + (now.getMonth() + 1)).slice(-2) + ":" + ("0" + now.getDate()).slice(-2) + " " + ("0" + now.getHours()).slice(-2) + ":" + ("0" + now.getMinutes()).slice(-2) + ":" + ("0" + now.getSeconds()).slice(-2);
            
            const exifDict = {
                "0th": {
                    271: "Meta", // Make
                    272: "iPhone 16 Pro", // Model
                    305: "17.4.1", // Software
                    306: exifDate, // DateTime
                    282: [72, 1],
                    283: [72, 1]
                },
                "Exif": {
                    36867: exifDate, // DateTimeOriginal
                    36868: exifDate, // DateTimeDigitized
                    42032: "Apple", // LensMake
                    42033: "iPhone 16 Pro back triple camera 24mm f/1.78", // LensModel
                    33434: [1, 120], // ExposureTime
                    33437: [18, 10], // FNumber
                    34855: 64 // ISO
                }
            };

            const exifBytes = piexif.dump(exifDict);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            const newImageDataURL = piexif.insert(exifBytes, dataUrl);

            // 4. Show Result
            preview.src = newImageDataURL;
            preview.style.display = 'block';
            downloadBtn.href = newImageDataURL;
            downloadBtn.style.display = 'block';
            
            statusText.innerText = "✅ Bypass Successful!";
            setTimeout(() => { statusBox.style.display = 'none'; }, 1500);
        }
    </script>
</body>
  </html>
